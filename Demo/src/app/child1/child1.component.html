<div class="wrapper">
    <h1>Template Driven</h1>

    <div class="template">
        <div class="form">
            <form>
                <label for="name">Name</label><br>
                <input type="text" name="name" /><br>
                <span class="validation-error">Name is required</span>

                <label for="password">Password</label><br>
                <input type="password" name="password" /><br>
                <span class="validation-error">Password is required</span>

                <label for="phoneNumber">Phone Number</label><br>
                <input type="number" name="phoneNumber" /><br>
                <span class="validation-error">Phone number is required</span>

                <label for="dateOfBirth">Date of Birth</label><br>
                <input type="date" name="dateOfBirth" /><br>
                <span class="validation-error">Date of Birth is required</span>

                <label for="role">Role</label>
                <select name="role">
                    <option value="1">Admin</option>
                    <option value="2">Manager</option>
                    <option value="3">Employee</option>
                </select><br>
                <span class="validation-error">Role is required</span>

                <br>
                <button type="submit">Submit</button><br>
            </form>
        </div>

        <div class="inputs">
            <h1>Name</h1>
            <p></p>

            <h1>Password</h1>
            <p></p>

            <h1>Phone Number</h1>
            <p></p>

            <h1>Date of Birth</h1>
            <p></p>

            <h1>Role</h1>
            <p></p>

            <h1>Submitted?</h1>
            <p></p>
        </div>
    </div>

    <div class="links">
        <a href="/reactive" class="go-to-reactive">
            Go to Reactive form
        </a>
    </div>
</div>
